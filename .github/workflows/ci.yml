name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --locked: fail if uv.lock is out of date instead of silently re-resolving.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    # Linux = future Docker/VPS, Windows = the dev machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      REQUIRE_FFMPEG: "1"  # render tests must run in CI, never silently skip
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        # apt mirrors occasionally stall: every call has its own timeout and up to 3 tries.
        run: |
          sudo rm -f /var/lib/man-db/auto-update  # man-db reindexing can stall for minutes
          for attempt in 1 2 3; do
            if timeout 120 sudo apt-get update -qq \
              && timeout 180 sudo apt-get install -y -qq --no-install-recommends ffmpeg; then
              break
            fi
            echo "::warning::apt attempt $attempt failed or timed out, retrying"
            sleep 10
          done
          command -v ffmpeg
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: choco install ffmpeg -y --no-progress
      - run: ffmpeg -version
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --durations=5
