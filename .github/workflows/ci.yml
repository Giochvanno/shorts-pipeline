name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the outdated run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      # --locked: fail if uv.lock is out of date instead of silently re-resolving.
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    # Linux = future Docker/VPS, Windows = the dev machine.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      REQUIRE_FFMPEG: "1"  # render tests must run in CI, never silently skip
    steps:
      - uses: actions/checkout@v7
      - name: Install FFmpeg (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        # apt mirrors sometimes stall or go down: bounded apt first, then a static build
        # from GitHub Releases, which does not depend on the Ubuntu mirrors at all.
        run: |
          if command -v ffmpeg >/dev/null; then ffmpeg -version | head -1; exit 0; fi
          sudo rm -f /var/lib/man-db/auto-update  # man-db reindexing can stall for minutes
          if timeout 60 sudo apt-get update -qq \
            && timeout 150 sudo apt-get install -y -qq --no-install-recommends ffmpeg; then
            exit 0
          fi
          echo "::warning::apt unavailable, using the static FFmpeg build from GitHub Releases"
          url=https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          curl -fsSL --retry 3 --max-time 300 "$url" -o "$RUNNER_TEMP/ffmpeg.tar.xz"
          mkdir -p "$RUNNER_TEMP/ffmpeg"
          tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP/ffmpeg" --strip-components=1
          echo "$RUNNER_TEMP/ffmpeg/bin" >> "$GITHUB_PATH"
      - name: Install FFmpeg (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: choco install ffmpeg -y --no-progress
      - run: ffmpeg -version && ffprobe -version
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest --durations=5
