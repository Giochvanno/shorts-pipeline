# Series "Fact of the Day": the test series that proves the pipeline is stable.
# The file name must match `id`. Fields marked [YOURS] are creative decisions:
# the values below are drafts to keep CI green, rewrite them in your own voice.

id: fact-of-day
title: Fact of the Day

format:
  duration_s: { min: 20, max: 45 }
  hook_max_s: 2             # the hook must land within the first 2 seconds
  scenes: { min: 5, max: 8 }
  # Rotated per video so the channel never looks templated (YouTube rule).
  structures:
    - question_reveal       # ask a question, delay the answer, reveal
    - myth_vs_fact          # common belief -> what is actually true
    - countdown             # 3 quick facts, the strongest last
    - comparison            # put two things side by side (scale, time, size)

script:
  tone: >-                  # [YOURS]
    Curious friend at a cafe, not a lecturer. Short sentences, concrete numbers,
    one surprising detail per fact. Light humor, never clickbait lies.
  angle: >-                 # [YOURS] what makes this series yours
    Every fact ends with "so what": why it matters or how to see it yourself.
  rules:
    - Every claim must be checkable; prefer facts with a named source.
    - No "did you know" openings.
  extra_banned_topics: []   # added on top of the hard-banned topics in code

voice:
  voice_id: CHANGE_ME       # [YOURS] ElevenLabs voice ID
  stability: 0.5
  similarity_boost: 0.75
  speed: 1.0

visual_bible:
  style_prefix: >-          # [YOURS] prepended to every FLUX prompt
    Clean editorial illustration, soft grain, flat shapes with subtle depth,
    museum-poster feel
  palette: ["#1B1F3B", "#F4D35E", "#EE964B", "#F2F2F2"]   # [YOURS]
  lighting: soft diffused daylight, gentle shadows
  camera: medium or wide shot, eye level, centered subject
  extra_forbidden: [watermark, logo]   # added on top of the hard rules in code
  max_attempts_per_scene: 3            # then fall back to stock

captions:
  font: Montserrat ExtraBold
  words_per_chunk: 3
  highlight_color: "#F4D35E"
  bottom_margin_ratio: 0.22  # share of frame height kept free at the bottom

music:
  moods: [curious, light]
  duck_below_voice_db: 18    # music sits this many dB under the voice
