# Channel-wide settings. Validated by pipeline/config.py (`python -m pipeline check-config`).
# Unknown keys are an error, so a typo never gets silently ignored.

# Per port: fake = offline fake, $0; real = the provider below in `models`.
# Real providers are switched on one at a time. For a single run:
#   python -m pipeline run ... --real llm     (that port real)
#   python -m pipeline run ... --mode fake    (everything fake)
mode:
  llm: fake
  tts: fake
  images: fake
  stt: fake                 # real = faster-whisper on the CPU (free, `uv sync --extra stt`)

channel:
  name: "Fact of the Day (test)"
  language: en              # language of scripts, voice and captions
  timezone: Asia/Seoul      # used for nightly runs and publish times

upload:
  privacy: private          # test phase: private only (private | unlisted | public)
  category_id: "27"         # 27 = Education
  made_for_kids: false
  synthetic_media: true     # YouTube "altered or synthetic content" disclosure

budget:
  # Two accounts, both checked before every call (pipeline/costs.py).
  # cash: money per call (fal, ElevenLabs, the Anthropic API). Reaching a limit pauses the
  # video (paused_budget) with an alert; raise the limit, then `resume`. Set for the current
  # stage, not ahead of it: a loop that keeps redrawing frames has to hit a wall.
  max_cash_per_video_usd: 0.75
  max_image_cash_per_video_usd: 0.55   # ~11 Nano Banana 2.1 frames: 7 scenes + 4 retries
  max_cash_monthly_usd: 20.00          # calendar month, UTC; test stage (launch: ~40-50)
  # subscription_credit: what `claude -p` reports a call would cost on the API. Paid from
  # the Claude subscription's monthly credit, not from cash: never part of a video's cash
  # limit, but when the credit runs out scripts stop, hence its own limit and a warning.
  max_subscription_credit_monthly_usd: 18.00
  subscription_credit_warn_at: 0.8     # alert once at 80 % of it

# Model IDs live here and only here (enforced by tests/test_architecture.py).
# Real adapters re-check IDs and prices when they are connected.
models:
  llm:
    timeout_s: 180          # one call; a hung CLI process is killed and retried
    api_fallback: false     # anthropic_api costs separate money: enable explicitly
    heavy:                  # script, critic, frame check, weekly review
      primary:  { provider: claude_cli,    model: claude-opus-5-5 }
      fallback: { provider: anthropic_api, model: claude-opus-5-5 }
    light:                  # titles, tags, stock search queries
      primary:  { provider: claude_cli,    model: claude-haiku-5-5 }
      fallback: { provider: anthropic_api, model: claude-haiku-5-5 }
  tts:
    timeout_s: 60           # one request; a 45 s narration is synthesized in seconds
    usd_per_credit: 0.0002  # Starter: $6 / 30,000 credits. Credits per call come from the API
    primary:  { provider: elevenlabs, model: eleven_multilingual_v2 }
    fallback: null          # TODO: choose a fallback TTS provider (open question)
  stt:                      # speech-to-text for captions, runs locally
    primary:  { provider: faster_whisper, model: small.en }
    fallback: null
  images:
    timeout_s: 120           # one frame takes seconds; a cold start can take longer
    # Chosen in three rounds on video 10 (docs/decisions/image-model.md): the only model
    # with the right subject in all 7 scenes. One model per video, never mixed: a retry is
    # the same model with the next seed. The fallback is for when the main model is
    # unavailable; it runs on fal from open weights, while every Nano Banana is a proxy
    # to Google, so one Google outage takes out them all.
    primary:  { provider: fal, model: google/nano-banana-2.1 }
    fallback: { provider: fal, model: fal-ai/flux-2 }
    # How each fal model is called and what it costs (fal model pages, checked 2026-11-16).
    # All carry fal's "Commercial use" badge. Prices are the upper bound of the bill.
    fal_models:
      fal-ai/flux/dev:
        label: FLUX.1 [dev]
        size: pixels
        usd_per_megapixel: 0.025
        params: { enable_safety_checker: true }
        licence: "FLUX.1 [dev] via fal.ai: commercial use per the fal model page (checked 2026-11-16)"
      fal-ai/flux-2:
        label: FLUX.2 [dev]
        size: pixels
        usd_per_megapixel: 0.012
        # false: the prompt stays ours, word for word (fal would rewrite it otherwise)
        params: { enable_safety_checker: true, enable_prompt_expansion: false }
        licence: "FLUX.2 [dev] via fal.ai: commercial use per the fal model page (checked 2026-11-16)"
      fal-ai/flux-2-pro:
        label: FLUX.2 [pro]
        size: pixels
        usd_per_megapixel: 0.03     # $0.03 the first MP, $0.015 each further: one MP for us
        params: { enable_safety_checker: true, safety_tolerance: "2" }
        licence: "FLUX.2 [pro] via fal.ai: commercial use per the fal model page (checked 2026-11-16)"
      fal-ai/nano-banana:
        label: Nano Banana
        size: aspect_ratio           # Gemini 2.5 Flash Image: 9:16 comes out 768x1344
        usd_per_image: 0.04          # fal lists $0.039-0.0398 per image
        params: { safety_tolerance: "4" }
        licence: "Nano Banana (Gemini 2.5 Flash Image) via fal.ai: commercial use per the fal model page; SynthID mark (checked 2026-11-16)"
      google/nano-banana-2.1:
        label: Nano Banana 2.1
        size: aspect_ratio
        # Billed by tokens: fal lists ~$0.040 for one 1K image with medium thinking; 0.05 leaves
        # room for longer thinking, so the estimate stays at or above the bill.
        usd_per_image: 0.05
        params: { resolution: "1K", thinking_level: medium, safety_tolerance: "4", enable_web_search: false }
        licence: "Nano Banana 2.1 via fal.ai: commercial use per the fal model page; Gemini API terms (2026-03-23): Google claims no ownership of generated content; SynthID mark (checked 2026-11-17)"
      bytedance/seedream/v5.5/text-to-image:
        label: Seedream 5.5
        size: pixels                 # 720x1280 = 921,600 px, the smallest size it takes
        usd_per_image: 0.03          # up to 2,610,000 px; above that $0.0405
        takes_seed: false            # no seed on fal: every call is a new draw
        params: { enable_safety_checker: true, watermark: false }
        licence: "Seedream 5.5 via fal.ai: commercial use per the fal model page (checked 2026-11-16)"
