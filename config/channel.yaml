# Channel-wide settings. Validated by pipeline/config.py (`python -m pipeline check-config`).
# Unknown keys are an error, so a typo never gets silently ignored.

# Per port: fake = offline fake, $0; real = the provider below in `models`.
# Real providers are switched on one at a time. For a single run:
#   python -m pipeline run ... --real llm     (that port real)
#   python -m pipeline run ... --mode fake    (everything fake)
mode:
  llm: fake
  tts: fake
  images: fake

channel:
  name: "Fact of the Day (test)"
  language: en              # language of scripts, voice and captions
  timezone: Asia/Seoul      # used for nightly runs and publish times

upload:
  privacy: private          # test phase: private only (private | unlisted | public)
  category_id: "27"         # 27 = Education
  made_for_kids: false
  synthetic_media: true     # YouTube "altered or synthetic content" disclosure

budget:
  # Checked before every paid call; reaching a limit stops the video with an alert.
  # Counts per-call spend (API tokens, images, ...), not fixed monthly subscriptions.
  max_cost_per_video_usd: 0.50
  max_monthly_usd: 10.00          # calendar month, UTC

# Model IDs live here and only here (enforced by tests/test_architecture.py).
# Real adapters re-check IDs and prices when they are connected.
models:
  llm:
    timeout_s: 180          # one call; a hung CLI process is killed and retried
    api_fallback: false     # anthropic_api costs separate money: enable explicitly
    heavy:                  # script, critic, frame check, weekly review
      primary:  { provider: claude_cli,    model: claude-opus-5-5 }
      fallback: { provider: anthropic_api, model: claude-opus-5-5 }
    light:                  # titles, tags, stock search queries
      primary:  { provider: claude_cli,    model: claude-haiku-5-5 }
      fallback: { provider: anthropic_api, model: claude-haiku-5-5 }
  tts:
    primary:  { provider: elevenlabs, model: eleven_multilingual_v2 }
    fallback: null          # TODO: choose a fallback TTS provider (open question)
  images:
    primary:  { provider: fal,       model: fal-ai/flux/dev }
    fallback: { provider: replicate, model: black-forest-labs/flux-dev }
